name: CI

on:
  push:
    branches: [main]
  pull_request:
  # `npm audit` is time-dependent, not diff-dependent: a newly published
  # advisory against an unchanged transitive dep turns this repo red with no
  # commit at all. Without a run on a clock, that only surfaces at the next
  # unrelated push — which is how main went red on 2026-07-23 behind a green
  # local gate and stayed red for 27 pushes across 47 days. Weekly, so an
  # advisory is found by the schedule rather than by whoever pushes next.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  # event_name is in the key so a scheduled run and a push run on the same ref
  # do not cancel each other; without it the weekly audit would show up as
  # cancelled push runs, which is noise that reads like a flake.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Publish a prebuilt tarball of the built engine so downstream consumers
  # (e.g. the aoe2 game repo, which depends on civ-engine via `file:../civ-engine`)
  # can fetch the dist in THEIR CI without rebuilding the engine — building it
  # is this repo's CI's job, not theirs. Runs only on push to main, after the
  # full `test` matrix passes, and refreshes the rolling `engine-dist` release.
  publish-dist:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Pack the built engine to a stable asset name
        run: |
          npm pack
          mv civ-engine-*.tgz civ-engine.tgz
      - name: Refresh the rolling engine-dist release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create engine-dist \
            --title "civ-engine prebuilt dist (rolling)" \
            --notes "Prebuilt tarball of civ-engine \`main\` for downstream CI (e.g. aoe2). Refreshed on every push to main; consume with: gh release download engine-dist --repo ${{ github.repository }} --pattern civ-engine.tgz" \
            --prerelease 2>/dev/null || true
          gh release upload engine-dist civ-engine.tgz --clobber

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 24 is the fleet baseline and what .nvmrc pins, so it is what everyone
        # develops on; 20 and 22 are the older majors the engines field still
        # promises (">=20") and each keeps a job proving it. 24 was missing here
        # until 2026-08-31 — the version every local gate ran on was the one
        # version CI never checked.
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm pack --dry-run
      - run: node scripts/rts-benchmark.mjs --check
      # MCP subpackage (sequenced after the root build: its file:.. dep
      # resolves against dist/)
      - run: npm ci
        working-directory: mcp
      - run: npm audit --audit-level=high
        working-directory: mcp
      - run: npm run build
        working-directory: mcp
      - run: npm test
        working-directory: mcp
